<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>活动报名 - 团校积分系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/win11-additions.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>活动报名</h1>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.location.href='/student'" class="secondary">返回首页</button>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>

        <div class="content">
            <!-- 标签页 -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0;">
                <button id="availableTab" class="tab-btn active" onclick="switchTab('available')">
                    可报名问卷
                </button>
                <button id="myRegistrationsTab" class="tab-btn" onclick="switchTab('myRegistrations')">
                    我的报名
                </button>
            </div>

            <!-- 可报名问卷列表 -->
            <div id="availablePanel" class="tab-panel active">
                <div id="availableList"></div>
            </div>

            <!-- 我的报名列表 -->
            <div id="myRegistrationsPanel" class="tab-panel">
                <div id="myRegistrationsList"></div>
            </div>
        </div>
    </div>

    <!-- 填写问卷模态框 -->
    <div id="fillQuestionnaireModal" class="modal">
        <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
            <h2 id="questionnaireTitle">填写问卷</h2>
            <input type="hidden" id="questionnaireId">
            
            <div style="padding: 12px; background: #e3f2fd; border-radius: 4px; margin-bottom: 20px;">
                <strong>提示：</strong>手机号和微信号将自动从注册问卷中获取
            </div>
            
            <div class="form-group">
                <label style="display: block; margin-bottom: 10px;">
                    1. 意向学分类别 <span style="color: red;">*</span>
                </label>
                <div id="categoryRadios" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- 单选框将在这里动态生成 -->
                </div>
            </div>
            
            <!-- 自定义题目容器 -->
            <div id="customQuestionsContainer"></div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="submitQuestionnaire()" style="flex: 1;">提交</button>
                <button class="secondary" onclick="closeModal('fillQuestionnaireModal')" style="flex: 1;">取消</button>
            </div>
        </div>
    </div>

    <script>
        let availableQuestionnaires = [];
        let myRegistrations = [];
        let categories = [];

        async function loadData() {
            try {
                // 加载学分类别
                const categoriesResponse = await fetch('/api/student/categories');
                const categoriesData = await categoriesResponse.json();
                if (categoriesData.success) {
                    categories = categoriesData.categories;
                    console.log('加载学分类别成功:', categories);
                }

                // 加载可报名问卷
                const availableResponse = await fetch('/api/student/questionnaires/available');
                const availableData = await availableResponse.json();
                console.log('可报名问卷API响应:', availableData);
                if (availableData.success) {
                    availableQuestionnaires = availableData.questionnaires;
                    console.log('可报名问卷数量:', availableQuestionnaires.length);
                    renderAvailableQuestionnaires();
                } else {
                    console.error('加载可报名问卷失败:', availableData.message);
                    alert('加载可报名问卷失败：' + availableData.message);
                }

                // 加载我的报名
                const myResponse = await fetch('/api/student/questionnaires/my_registrations');
                const myData = await myResponse.json();
                console.log('我的报名API响应:', myData);
                if (myData.success) {
                    myRegistrations = myData.registrations;
                    console.log('我的报名数量:', myRegistrations.length);
                    renderMyRegistrations();
                } else {
                    console.error('加载我的报名失败:', myData.message);
                }
            } catch (error) {
                alert('加载失败：' + error.message);
                console.error('加载错误:', error);
            }
        }

        function renderAvailableQuestionnaires() {
            const container = document.getElementById('availableList');
            
            if (availableQuestionnaires.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #999;">
                        <div style="font-size: 48px; margin-bottom: 20px;">📋</div>
                        <div style="font-size: 18px;">暂无可报名的问卷</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            availableQuestionnaires.forEach(q => {
                const card = document.createElement('div');
                card.className = 'questionnaire-card';
                
                const maxText = q.max_participants > 0 ? q.max_participants : '不限';
                const isFull = q.max_participants > 0 && q.response_count >= q.max_participants;
                const isWaitlist = q.max_participants > 0 && q.response_count >= q.max_participants;
                const canRegister = !q.is_registered;  // 允许候补报名
                
                let statusHtml = '';
                let buttonText = '立即报名';
                let buttonStyle = 'primary';
                
                if (q.is_registered) {
                    // 已报名，显示是否候补
                    if (q.is_waitlist) {
                        statusHtml = '<span class="status-badge" style="background: #fff3e0; color: #e65100;">候补</span>';
                    } else {
                        statusHtml = '<span class="status-badge status-qualified">已报名</span>';
                    }
                    buttonText = '已报名';
                    buttonStyle = 'disabled';
                } else if (isWaitlist) {
                    statusHtml = '<span class="status-badge" style="background: #fff3e0; color: #e65100;">可候补</span>';
                    buttonText = '候补报名';
                }
                
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
                        <h3 style="margin: 0; color: #1976d2;">📋 ${q.title}</h3>
                        ${statusHtml}
                    </div>
                    <div style="color: #666; line-height: 1.8;">
                        <div><strong>活动：</strong>${q.activity_name}</div>
                        <div><strong>时间：</strong>${q.start_time} ~ ${q.end_time}</div>
                        <div><strong>人数：</strong>已报名 ${q.response_count}/${maxText}</div>
                        ${isWaitlist && !q.is_registered ? '<div style="color: #ff9800;"><strong>提示：</strong>名额已满，报名后将进入候补名单</div>' : ''}
                    </div>
                    <div style="margin-top: 15px;">
                        ${canRegister ? 
                            `<button onclick="showFillModal('${q.questionnaire_id}')" class="${buttonStyle}" style="width: 100%;">${buttonText}</button>` :
                            `<button disabled style="width: 100%; opacity: 0.5; cursor: not-allowed;">已报名</button>`
                        }
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function renderMyRegistrations() {
            const container = document.getElementById('myRegistrationsList');
            
            if (myRegistrations.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #999;">
                        <div style="font-size: 48px; margin-bottom: 20px;">📝</div>
                        <div style="font-size: 18px;">您还没有报名任何活动</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            myRegistrations.forEach(r => {
                const card = document.createElement('div');
                card.className = 'questionnaire-card';
                
                let statusBadge = '';
                if (r.status === 'cancelled') {
                    statusBadge = '<span class="status-badge status-unqualified">已取消</span>';
                } else if (r.is_ended) {
                    // 已截止，显示结果
                    if (r.is_selected) {
                        statusBadge = '<span class="status-badge status-qualified">✓ 已入选</span>';
                    } else {
                        // 截止后未入选显示"未入选"而不是"候补"
                        statusBadge = '<span class="status-badge status-unqualified">未入选</span>';
                    }
                } else {
                    // 未截止
                    if (r.is_waitlist) {
                        statusBadge = '<span class="status-badge" style="background: #fff3e0; color: #e65100;">候补</span>';
                    } else {
                        statusBadge = '<span class="status-badge status-qualified">已报名</span>';
                    }
                }
                
                // 排名信息
                let rankInfo = '';
                if (r.status === 'active' && r.rank > 0) {
                    if (r.max_participants > 0) {
                        rankInfo = `<div><strong>排名：</strong>${r.rank}/${r.max_participants}${r.is_waitlist ? ' (候补)' : ''}</div>`;
                    } else {
                        rankInfo = `<div><strong>报名顺序：</strong>第${r.rank}位</div>`;
                    }
                }
                
                // 结果提示
                let resultInfo = '';
                if (r.is_ended && r.status === 'active') {
                    if (r.is_selected) {
                        resultInfo = '<div style="padding: 10px; background: #e8f5e9; border-left: 4px solid #4caf50; border-radius: 4px; margin-top: 10px;"><strong>恭喜！</strong>您已成功入选此活动</div>';
                    } else {
                        // 截止后未入选
                        resultInfo = '<div style="padding: 10px; background: #ffebee; border-left: 4px solid #f44336; border-radius: 4px; margin-top: 10px;"><strong>很遗憾，</strong>您未能入选此活动</div>';
                    }
                }
                
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
                        <h3 style="margin: 0; color: #1976d2;">📋 ${r.questionnaire_title}</h3>
                        ${statusBadge}
                    </div>
                    <div style="color: #666; line-height: 1.8;">
                        <div><strong>活动：</strong>${r.activity_name}</div>
                        ${rankInfo}
                        ${r.intended_category ? `<div><strong>意向类别：</strong>${r.intended_category}</div>` : ''}
                        <div><strong>提交时间：</strong>${r.submit_time}</div>
                    </div>
                    ${resultInfo}
                    ${r.status === 'active' && !r.is_ended ? 
                        `<div style="margin-top: 15px; display: flex; gap: 10px;">
                            <button onclick="editRegistration('${r.response_id}', '${r.questionnaire_id}')" class="secondary" style="flex: 1;">修改</button>
                            <button onclick="cancelRegistration('${r.response_id}')" class="danger" style="flex: 1;">取消报名</button>
                        </div>` : ''
                    }
                `;
                
                container.appendChild(card);
            });
        }

        function switchTab(tab) {
            // 更新标签按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            
            if (tab === 'available') {
                document.getElementById('availableTab').classList.add('active');
                document.getElementById('availablePanel').classList.add('active');
            } else {
                document.getElementById('myRegistrationsTab').classList.add('active');
                document.getElementById('myRegistrationsPanel').classList.add('active');
            }
        }

        async function showFillModal(questionnaireId, isEdit = false, existingResponse = null) {
            const q = availableQuestionnaires.find(item => item.questionnaire_id === questionnaireId);
            if (!q) {
                console.error('未找到问卷:', questionnaireId);
                return;
            }
            
            // 检查注册问卷必填字段
            if (!isEdit) {
                try {
                    const regResponse = await fetch('/api/student/registration_questionnaire');
                    const regData = await regResponse.json();
                    if (regData.success) {
                        const regQ = regData.questionnaire;
                        if (!regQ.phone || !regQ.wechat) {
                            if (confirm('请先完善注册问卷中的手机号和微信号。是否现在前往填写？')) {
                                window.location.href = '/student/registration_questionnaire';
                            }
                            return;
                        }
                    }
                } catch (error) {
                    console.error('检查注册问卷失败:', error);
                }
            }
            
            console.log('问卷信息:', q);
            console.log('活动ID:', q.activity_id);
            
            document.getElementById('questionnaireTitle').textContent = isEdit ? `修改报名 - ${q.title}` : q.title;
            document.getElementById('questionnaireId').value = questionnaireId;
            
            // 获取活动的类别
            let activityCategories = [];
            try {
                const url = `/api/student/activity/${q.activity_id}/categories`;
                console.log('请求URL:', url);
                const activityResponse = await fetch(url);
                console.log('响应状态:', activityResponse.status);
                const activityData = await activityResponse.json();
                console.log('活动类别API响应:', activityData);
                if (activityData.success) {
                    activityCategories = activityData.categories;
                    console.log('活动允许的类别:', activityCategories);
                } else {
                    console.error('获取活动类别失败:', activityData.message);
                    alert('获取活动类别失败：' + activityData.message);
                    return;
                }
            } catch (error) {
                console.error('获取活动类别失败:', error);
                alert('获取活动类别失败：' + error.message);
                return;
            }
            
            // 生成单选框
            const categoryRadios = document.getElementById('categoryRadios');
            categoryRadios.innerHTML = '';
            
            if (activityCategories.length === 0) {
                alert('该活动没有设置学分类别，请联系管理员');
                return;
            }
            
            activityCategories.forEach(categoryName => {
                const radio = document.createElement('label');
                radio.style.cssText = 'display: flex; align-items: center; padding: 10px; border: 2px solid #e0e0e0; border-radius: 4px; cursor: pointer; transition: all 0.2s;';
                radio.onmouseover = function() { this.style.borderColor = '#1976d2'; this.style.background = '#f5f5f5'; };
                radio.onmouseout = function() { 
                    if (!this.querySelector('input').checked) {
                        this.style.borderColor = '#e0e0e0'; 
                        this.style.background = 'white';
                    }
                };
                
                const checked = isEdit && existingResponse && existingResponse.intended_category === categoryName ? 'checked' : '';
                radio.innerHTML = `
                    <input type="radio" name="intendedCategory" value="${categoryName}" ${checked} 
                           style="margin-right: 10px; width: 18px; height: 18px; cursor: pointer;"
                           onchange="document.querySelectorAll('#categoryRadios label').forEach(l => { l.style.borderColor = '#e0e0e0'; l.style.background = 'white'; }); this.parentElement.style.borderColor = '#1976d2'; this.parentElement.style.background = '#e3f2fd';">
                    <span style="font-size: 16px;">${categoryName}</span>
                `;
                
                if (checked) {
                    radio.style.borderColor = '#1976d2';
                    radio.style.background = '#e3f2fd';
                }
                
                categoryRadios.appendChild(radio);
            });
            
            // 渲染自定义题目
            const customQuestionsContainer = document.getElementById('customQuestionsContainer');
            customQuestionsContainer.innerHTML = '';
            
            if (q.custom_questions && q.custom_questions.length > 0) {
                q.custom_questions.forEach((question, index) => {
                    const questionDiv = document.createElement('div');
                    questionDiv.className = 'form-group';
                    questionDiv.style.marginTop = '20px';
                    
                    const questionNumber = index + 2;
                    const requiredMark = question.required ? '<span style="color: red;">*</span>' : '';
                    
                    switch(question.question_type) {
                        case 'description':
                            questionDiv.innerHTML = `
                                <div style="padding: 12px; background: #f5f5f5; border-left: 4px solid #1976d2; border-radius: 4px; white-space: pre-wrap; line-height: 1.6;">
                                    ${question.question_text}
                                </div>
                            `;
                            break;
                        
                        case 'single_choice':
                            const existingAnswer = isEdit && existingResponse && existingResponse.custom_answers && existingResponse.custom_answers[question.question_id] ? existingResponse.custom_answers[question.question_id].answer : '';
                            questionDiv.innerHTML = `
                                <label style="display: block; margin-bottom: 10px; font-weight: bold;">
                                    ${questionNumber}. ${question.question_text} ${requiredMark}
                                </label>
                                <div id="question_${question.question_id}" style="display: flex; flex-direction: column; gap: 8px;">
                                    ${question.options.map(opt => `
                                        <label style="display: flex; align-items: center; padding: 10px; border: 2px solid #e0e0e0; border-radius: 4px; cursor: pointer; transition: all 0.2s;">
                                            <input type="radio" name="question_${question.question_id}" value="${opt}" ${opt === existingAnswer ? 'checked' : ''}
                                                   style="margin-right: 10px; width: 18px; height: 18px; cursor: pointer;">
                                            <span>${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            `;
                            break;
                        
                        case 'multiple_choice':
                            const existingAnswers = isEdit && existingResponse && existingResponse.custom_answers && existingResponse.custom_answers[question.question_id] ? existingResponse.custom_answers[question.question_id].answer : [];
                            questionDiv.innerHTML = `
                                <label style="display: block; margin-bottom: 10px; font-weight: bold;">
                                    ${questionNumber}. ${question.question_text} ${requiredMark}
                                </label>
                                <div id="question_${question.question_id}" style="display: flex; flex-direction: column; gap: 8px;">
                                    ${question.options.map(opt => `
                                        <label style="display: flex; align-items: center; padding: 10px; border: 2px solid #e0e0e0; border-radius: 4px; cursor: pointer; transition: all 0.2s;">
                                            <input type="checkbox" name="question_${question.question_id}" value="${opt}" ${existingAnswers.includes(opt) ? 'checked' : ''}
                                                   style="margin-right: 10px; width: 18px; height: 18px; cursor: pointer;">
                                            <span>${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            `;
                            break;
                        
                        case 'text':
                            const existingText = isEdit && existingResponse && existingResponse.custom_answers && existingResponse.custom_answers[question.question_id] ? existingResponse.custom_answers[question.question_id].answer : '';
                            questionDiv.innerHTML = `
                                <label style="display: block; margin-bottom: 10px; font-weight: bold;">
                                    ${questionNumber}. ${question.question_text} ${requiredMark}
                                </label>
                                <input type="text" id="question_${question.question_id}" 
                                       maxlength="${question.max_length || 200}" 
                                       value="${existingText}"
                                       placeholder="请输入答案"
                                       style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 4px;">
                            `;
                            break;
                        
                        case 'textarea':
                            const existingTextarea = isEdit && existingResponse && existingResponse.custom_answers && existingResponse.custom_answers[question.question_id] ? existingResponse.custom_answers[question.question_id].answer : '';
                            questionDiv.innerHTML = `
                                <label style="display: block; margin-bottom: 10px; font-weight: bold;">
                                    ${questionNumber}. ${question.question_text} ${requiredMark}
                                </label>
                                <textarea id="question_${question.question_id}" 
                                          rows="4" 
                                          maxlength="${question.max_length || 500}" 
                                          placeholder="请输入答案"
                                          style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 4px; resize: vertical;">${existingTextarea}</textarea>
                            `;
                            break;
                    }
                    
                    customQuestionsContainer.appendChild(questionDiv);
                });
            }
            
            // 如果是编辑模式，保存response_id
            if (isEdit && existingResponse) {
                document.getElementById('questionnaireId').setAttribute('data-response-id', existingResponse.response_id);
            } else {
                document.getElementById('questionnaireId').removeAttribute('data-response-id');
            }
            
            showModal('fillQuestionnaireModal');
        }

        async function submitQuestionnaire() {
            const questionnaireIdElement = document.getElementById('questionnaireId');
            const questionnaireId = questionnaireIdElement.value;
            const responseId = questionnaireIdElement.getAttribute('data-response-id');
            
            // 获取选中的单选框
            const selectedRadio = document.querySelector('input[name="intendedCategory"]:checked');
            if (!selectedRadio) {
                alert('请选择意向学分类别');
                return;
            }
            const intendedCategory = selectedRadio.value;
            
            // 收集自定义答案
            const q = availableQuestionnaires.find(item => item.questionnaire_id === questionnaireId);
            const customAnswers = {};
            
            if (q && q.custom_questions) {
                for (const question of q.custom_questions) {
                    if (question.question_type === 'description') continue;
                    
                    const questionId = question.question_id;
                    
                    switch(question.question_type) {
                        case 'single_choice':
                            const radio = document.querySelector(`input[name="question_${questionId}"]:checked`);
                            if (radio) {
                                customAnswers[questionId] = { answer: radio.value };
                            } else if (question.required) {
                                alert(`请回答：${question.question_text}`);
                                return;
                            }
                            break;
                        
                        case 'multiple_choice':
                            const checkboxes = document.querySelectorAll(`input[name="question_${questionId}"]:checked`);
                            const values = Array.from(checkboxes).map(cb => cb.value);
                            if (values.length > 0) {
                                customAnswers[questionId] = { answer: values };
                            } else if (question.required) {
                                alert(`请回答：${question.question_text}`);
                                return;
                            }
                            break;
                        
                        case 'text':
                        case 'textarea':
                            const input = document.getElementById(`question_${questionId}`);
                            if (input && input.value.trim()) {
                                customAnswers[questionId] = { answer: input.value.trim() };
                            } else if (question.required) {
                                alert(`请回答：${question.question_text}`);
                                return;
                            }
                            break;
                    }
                }
            }
            
            try {
                let url, method;
                if (responseId) {
                    // 更新现有报名
                    url = `/api/student/questionnaire/update/${responseId}`;
                    method = 'PUT';
                } else {
                    // 新建报名
                    url = '/api/student/questionnaire/submit';
                    method = 'POST';
                }
                
                const response = await fetch(url, {
                    method: method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        questionnaire_id: questionnaireId,
                        intended_category: intendedCategory,
                        custom_answers: customAnswers
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert(responseId ? '修改成功！' : '报名成功！');
                    closeModal('fillQuestionnaireModal');
                    loadData();
                } else {
                    alert((responseId ? '修改' : '报名') + '失败：' + result.message);
                }
            } catch (error) {
                alert((responseId ? '修改' : '报名') + '失败：' + error.message);
            }
        }

        function editRegistration(responseId, questionnaireId) {
            const registration = myRegistrations.find(r => r.response_id === responseId);
            if (!registration) return;
            
            showFillModal(questionnaireId, true, registration);
        }

        async function cancelRegistration(responseId) {
            if (!confirm('确定要取消报名吗？')) return;
            
            try {
                const response = await fetch(`/api/student/questionnaire/cancel/${responseId}`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('取消成功');
                    loadData();
                } else {
                    alert('取消失败：' + result.message);
                }
            } catch (error) {
                alert('取消失败：' + error.message);
            }
        }

        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        async function logout() {
            const response = await fetch('/api/logout', {method: 'POST'});
            window.location.href = '/';
        }

        // 页面加载时获取数据
        loadData();
    </script>

    <style>
        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #1976d2;
            border-bottom-color: #1976d2;
        }

        .tab-btn:hover {
            color: #1976d2;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .questionnaire-card {

            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

        .questionnaire-card:hover {
