<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>团校积分系统 - 管理员登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .login-container {
            margin: 0;
            animation: slideUp 0.4s ease;
            max-width: 520px;
            width: 90%;
            background: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #d13438, #ff6b6b);
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 8px 24px rgba(209, 52, 56, 0.3);
        }
        
        .login-title {
            font-size: 28px;
            font-weight: 600;
            color: #1f1f1f;
            margin: 0;
        }
        
        .login-subtitle {
            font-size: 15px;
            color: #616161;
            margin-top: 12px;
        }
        
        .form-group input {
            width: 100%;
            padding: 16px 18px;
            font-size: 16px;
        }
        
        button[type="submit"] {
            padding: 16px;
            font-size: 16px;
        }
        
        #message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            display: none;
        }
        
        #message.error {
            background: rgba(209, 52, 56, 0.1);
            color: #d13438;
            border: 1px solid rgba(209, 52, 56, 0.2);
            display: block;
        }
        
        button[type="submit"] {
            background: #d13438;
        }
        
        button[type="submit"]:hover {
            background: #b52e31;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="login-header">
            <div class="login-icon" style="background: linear-gradient(135deg, #d13438, #ff6b6b);">
                <img src="/static/icon.svg" alt="图标" style="width: 60px; height: 60px; filter: brightness(0) invert(1);">
            </div>
            <h1 class="login-title">团校积分系统</h1>
            <p class="login-subtitle">管理员登录</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>管理员账号</label>
                <input type="text" id="username" required placeholder="请输入管理员账号" autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label>管理员密码</label>
                <input type="password" id="password" required placeholder="请输入管理员密码" autocomplete="current-password">
            </div>
            <button type="submit" style="width: 100%; margin-top: 12px;">登录</button>
        </form>
        <p id="message"></p>
    </div>

    <script>
        // SHA-256 哈希函数（纯 JavaScript 实现，兼容 HTTP 环境）
        async function sha256(message) {
            // 尝试使用 crypto.subtle（HTTPS 或 localhost）
            if (window.crypto && window.crypto.subtle) {
                try {
                    const msgBuffer = new TextEncoder().encode(message);
                    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                    return hashHex;
                } catch (e) {
                    console.warn('crypto.subtle 不可用，使用纯 JS 实现');
                }
            }
            
            // 纯 JavaScript SHA-256 实现（用于 HTTP 环境）
            function rightRotate(value, amount) {
                return (value >>> amount) | (value << (32 - amount));
            }
            
            const mathPow = Math.pow;
            const maxWord = mathPow(2, 32);
            const lengthProperty = 'length';
            let i, j;
            let result = '';
            
            const words = [];
            const asciiBitLength = message[lengthProperty] * 8;
            
            let hash = sha256.h = sha256.h || [];
            const k = sha256.k = sha256.k || [];
            let primeCounter = k[lengthProperty];
            
            const isComposite = {};
            for (let candidate = 2; primeCounter < 64; candidate++) {
                if (!isComposite[candidate]) {
                    for (i = 0; i < 313; i += candidate) {
                        isComposite[i] = candidate;
                    }
                    hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                    k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
                }
            }
            
            message += '\x80';
            while (message[lengthProperty] % 64 - 56) message += '\x00';
            for (i = 0; i < message[lengthProperty]; i++) {
                j = message.charCodeAt(i);
                if (j >> 8) return;
                words[i >> 2] |= j << ((3 - i) % 4) * 8;
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength);
            
            for (j = 0; j < words[lengthProperty];) {
                const w = words.slice(j, j += 16);
                const oldHash = hash;
                hash = hash.slice(0, 8);
                
                for (i = 0; i < 64; i++) {
                    const w15 = w[i - 15], w2 = w[i - 2];
                    
                    const a = hash[0], e = hash[4];
                    const temp1 = hash[7]
                        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                        + ((e & hash[5]) ^ ((~e) & hash[6]))
                        + k[i]
                        + (w[i] = (i < 16) ? w[i] : (
                            w[i - 16]
                            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                            + w[i - 7]
                            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                        ) | 0
                        );
                    
                    const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                    
                    hash = [(temp1 + temp2) | 0].concat(hash);
                    hash[4] = (hash[4] + temp1) | 0;
                }
                
                for (i = 0; i < 8; i++) {
                    hash[i] = (hash[i] + oldHash[i]) | 0;
                }
            }
            
            for (i = 0; i < 8; i++) {
                for (j = 3; j + 1; j--) {
                    const b = (hash[i] >> (j * 8)) & 255;
                    result += ((b < 16) ? 0 : '') + b.toString(16);
                }
            }
            return result;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                // 对密码进行 SHA-256 哈希
                const password_hash = await sha256(password);
                
                const response = await fetch('/api/login/admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password_hash}),
                    credentials: 'include'  // 重要！允许发送和接收 Cookie
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/admin';
                } else {
                    const messageEl = document.getElementById('message');
                    messageEl.textContent = data.message || '账号或密码错误';
                    messageEl.className = 'error';
                }
            } catch (error) {
                const messageEl = document.getElementById('message');
                messageEl.textContent = '登录失败，请重试: ' + error.message;
                messageEl.className = 'error';
                console.error('登录错误详情:', error);
            }
        });
    </script>
</body>
</html>
