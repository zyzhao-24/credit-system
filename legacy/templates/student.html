<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>学生界面 - 团校积分系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/win11-additions.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>我的学分</h1>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchStudentTab('credits')">我的学分</button>
            <button class="tab" onclick="switchStudentTab('activities')">活动列表</button>
            <button class="tab" onclick="switchStudentTab('password')">修改密码</button>
            <button class="tab" onclick="window.location.href='/student/registration_questionnaire'" style="background: #4caf50; color: white;">📝 注册问卷</button>
            <button class="tab" onclick="window.location.href='/student/activity_registration'" style="background: #ff9800; color: white;">📋 活动报名</button>
            <button class="tab" onclick="exportToPDF()" style="margin-left: auto; background: #0078d4; color: white;">导出PDF</button>
        </div>
        
        <div id="credits" class="tab-content active">
            <div id="creditsInfo"></div>
        </div>
        
        <div id="activities" class="tab-content">
            <div id="activitiesInfo"></div>
        </div>
        
        <div id="password" class="tab-content">
            <div class="info-card">
                <h3>修改密码</h3>
                <div class="form-group">
                    <label>原密码</label>
                    <input type="password" id="oldPassword">
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="newPassword">
                </div>
                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" id="confirmPassword">
                </div>
                <button onclick="changePassword()">修改密码</button>
            </div>
        </div>
    </div>

    <script>
        function switchStudentTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'activities') {
                loadActivities();
            }
        }
        
        async function loadMyCredits() {
            try {
                const response = await fetch('/api/student/my_credits', {credentials: 'include'});
                const data = await response.json();
                
                if (data.success) {
                    // 保存数据到全局变量供PDF导出使用
                    window.currentStudentData = data;
                    displayCredits(data);
                } else {
                    alert('加载失败');
                }
            } catch (error) {
                alert('加载失败');
            }
        }

        function displayCredits(data) {
            let html = `
                <div class="info-card">
                    <h3>基本信息</h3>
                    <p><strong>学号：</strong>${data.student_id}</p>
                    <p><strong>姓名：</strong>${data.student_name}</p>
                </div>

                <div class="info-card">
                    <h3>总学分情况</h3>
                    <p><strong>已获得学分：</strong>${data.total_credits}</p>
                    <p><strong>合格学分：</strong>${data.total_required}</p>
                    <p><strong>总学分状态：</strong>
                        <span class="status-badge ${data.total_qualified ? 'status-qualified' : 'status-unqualified'}">
                            ${data.total_qualified ? '已合格' : '未合格'}
                        </span>
                    </p>
                    <p><strong>所有类别状态：</strong>
                        <span class="status-badge ${data.all_categories_qualified ? 'status-qualified' : 'status-unqualified'}">
                            ${data.all_categories_qualified ? '已合格' : '未合格'}
                        </span>
                    </p>
                    <p style="margin-top: 10px; padding-top: 10px; border-top: 2px solid #ddd;"><strong>最终合格情况：</strong>
                        <span class="status-badge ${data.final_qualified ? 'status-qualified' : 'status-unqualified'}" style="font-size: 16px;">
                            ${data.final_qualified ? '✓ 已合格' : '✗ 未合格'}
                        </span>
                    </p>
                    ${!data.final_qualified ? `
                        <p style="color: #666; font-size: 14px; margin-top: 10px;">
                            <em>提示：需要总学分达标且所有类别都合格才能最终合格</em>
                        </p>
                    ` : ''}
                </div>

                <div class="info-card">
                    <h3>各类别学分情况</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>类别</th>
                                <th>已获得学分</th>
                                <th>合格学分</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            for (const [category, status] of Object.entries(data.category_status)) {
                html += `
                    <tr>
                        <td>${category}</td>
                        <td>${status.credits}</td>
                        <td>${status.required}</td>
                        <td>
                            <span class="status-badge ${status.qualified ? 'status-qualified' : 'status-unqualified'}">
                                ${status.qualified ? '已合格' : '未合格'}
                            </span>
                        </td>
                    </tr>
                `;
            }

            html += `
                        </tbody>
                    </table>
                </div>

                <div class="info-card">
                    <h3>活动参与记录</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>活动名称</th>
                                <th>记录名称</th>
                                <th>学分</th>
                                <th>可选类别</th>
                                <th>计入类别</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.activities.forEach(activity => {
                html += `
                    <tr>
                        <td>${activity.activity_name}</td>
                        <td>${activity.record_name}</td>
                        <td>${activity.credits}</td>
                        <td>${activity.categories.join(', ')}</td>
                        <td>${activity.assigned_category || '-'}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('creditsInfo').innerHTML = html;
        }

        async function loadActivities() {
            const response = await fetch('/api/student/activities', {credentials: 'include'});
            const data = await response.json();
            
            if (data.success) {
                let html = '<div class="info-card"><h3>活动列表（按类别）</h3>';
                html += '<div class="activities-grid">';
                
                for (const [category, activities] of Object.entries(data.category_activities)) {
                    html += `<div class="activity-column">`;
                    html += `<h4>${category}</h4><ul>`;
                    activities.forEach(act => {
                        html += `<li>${act.activity_name}</li>`;
                    });
                    html += '</ul></div>';
                }
                
                if (data.no_category_activities.length > 0) {
                    html += `<div class="activity-column">`;
                    html += '<h4>无类别活动</h4><ul>';
                    data.no_category_activities.forEach(act => {
                        html += `<li>${act.activity_name}</li>`;
                    });
                    html += '</ul></div>';
                }
                
                html += '</div></div>';
                document.getElementById('activitiesInfo').innerHTML = html;
            }
        }
        
        async function changePassword() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!oldPassword || !newPassword || !confirmPassword) {
                alert('请填写所有字段');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                alert('两次输入的新密码不一致');
                return;
            }
            
            // 对旧密码进行哈希
            const msgBuffer = new TextEncoder().encode(oldPassword);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const old_password_hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            const response = await fetch('/api/student/change_password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify({
                    old_password_hash,
                    new_password: newPassword
                })
            });
            
            const data = await response.json();
            if (data.success) {
                alert('密码修改成功，请重新登录');
                await logout();
            } else {
                alert(data.message);
            }
        }
        
        async function logout() {
            await fetch('/api/logout', {method: 'POST', credentials: 'include'});
            window.location.href = '/';
        }

        // PDF导出功能
        function exportToPDF() {
            // 创建打印样式
            const printStyle = document.createElement('style');
            printStyle.textContent = `
                @media print {
                    @page {
                        margin: 10mm;
                        size: A4;
                    }
                    * {
                        -webkit-print-color-adjust: exact !important;
                        print-color-adjust: exact !important;
                        color-adjust: exact !important;
                    }
                    html, body {
                        margin: 0;
                        padding: 0;
                        height: auto;
                        background: white !important;
                    }
                    body * { 
                        visibility: hidden; 
                    }
                    .print-area, .print-area * { 
                        visibility: visible; 
                    }
                    .print-area {
                        position: absolute;
                        left: 0;
                        top: 0;
                        width: 100%;
                        background: white !important;
                        font-family: 'Microsoft YaHei', sans-serif;
                    }
                    .print-title {
                        text-align: center;
                        font-size: 20px;
                        font-weight: bold;
                        margin-bottom: 12px;
                        border-bottom: 2px solid #2196F3;
                        padding-bottom: 6px;
                        color: #1565C0;
                    }
                    .print-info {
                        margin-bottom: 10px;
                        padding: 8px;
                        border: 1px solid #64B5F6;
                        border-radius: 4px;
                        background: #E3F2FD !important;
                    }
                    .info-card {
                        margin-bottom: 10px;
                        padding: 8px;
                        border: 1px solid #64B5F6;
                        border-radius: 4px;
                        background: #BBDEFB !important;
                        page-break-inside: avoid;
                    }
                    .info-card h3 {
                        margin: 0 0 6px 0;
                        font-size: 15px;
                        color: #1565C0;
                    }
                    .info-card p {
                        margin: 3px 0;
                        font-size: 13px;
                    }
                    .status-badge {
                        display: inline-block;
                        padding: 2px 8px;
                        font-size: 12px;
                        border-radius: 3px;
                    }
                    .status-qualified { 
                        background: #d4edda !important;
                        color: #155724 !important;
                    }
                    .status-unqualified { 
                        background: #f8d7da !important;
                        color: #721c24 !important;
                    }
                    table {
                        width: 100%;
                        border-collapse: collapse;
                        margin: 6px 0;
                        font-size: 12px;
                        border: 1px solid #64B5F6;
                    }
                    th, td {
                        border: 1px solid #BBDEFB;
                        padding: 5px 6px;
                        text-align: left;
                    }
                    th { 
                        font-weight: bold;
                        background: #E3F2FD !important;
                        color: #1565C0;
                    }
                }
            `;
            document.head.appendChild(printStyle);
            
            // 创建打印内容
            const printContent = createPrintContent();
            
            // 创建打印区域
            const printArea = document.createElement('div');
            printArea.className = 'print-area';
            printArea.innerHTML = printContent;
            document.body.appendChild(printArea);
            
            // 打印
            window.print();
            
            // 清理
            setTimeout(() => {
                document.body.removeChild(printArea);
                document.head.removeChild(printStyle);
            }, 100);
        }
        
        function createPrintContent() {
            const data = window.currentStudentData || {};
            const now = new Date().toLocaleString('zh-CN');
            
            let html = `
                <div class="print-title">团校积分系统 - 学分报告</div>
                
                <div class="print-info">
                    <strong>学号：</strong>${data.student_id || ''} &nbsp;&nbsp;&nbsp;
                    <strong>姓名：</strong>${data.student_name || ''} &nbsp;&nbsp;&nbsp;
                    <strong>导出时间：</strong>${now}
                </div>
                
                <div class="info-card">
                    <h3>总学分情况</h3>
                    <p><strong>已获得学分：</strong>${data.total_credits || 0}</p>
                    <p><strong>合格学分：</strong>${data.total_required || 0}</p>
                    <p><strong>总学分状态：</strong>
                        <span class="status-badge ${data.total_qualified ? 'status-qualified' : 'status-unqualified'}">
                            ${data.total_qualified ? '✓ 已合格' : '✗ 未合格'}
                        </span>
                    </p>
                </div>
                
                <div class="info-card">
                    <h3>各类别学分情况</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>类别名称</th>
                                <th>已获学分</th>
                                <th>合格学分</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            if (data.category_status) {
                for (const [categoryName, status] of Object.entries(data.category_status)) {
                    html += `
                        <tr>
                            <td>${categoryName}</td>
                            <td>${status.credits}</td>
                            <td>${status.required}</td>
                            <td>
                                <span class="status-badge ${status.qualified ? 'status-qualified' : 'status-unqualified'}">
                                    ${status.qualified ? '✓ 已合格' : '✗ 未合格'}
                                </span>
                            </td>
                        </tr>
                    `;
                }
            }
            
            html += `
                        </tbody>
                    </table>
                </div>
                
                <div class="info-card">
                    <h3>参与活动详情</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>活动名称</th>
                                <th>记录名称</th>
                                <th>学分</th>
                                <th>可选类别</th>
                                <th>计入类别</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            if (data.activities) {
                data.activities.forEach(activity => {
                    html += `
                        <tr>
                            <td>${activity.activity_name}</td>
                            <td>${activity.record_name}</td>
                            <td>${activity.credits}</td>
                            <td>${activity.categories ? activity.categories.join(', ') : ''}</td>
                            <td>${activity.assigned_category || '-'}</td>
                        </tr>
                    `;
                });
            }
            
            html += `
                        </tbody>
                    </table>
                </div>
                
                <div class="info-card" style="text-align: center; font-size: 18px; font-weight: bold;">
                    最终合格状态：
                    <span class="status-badge ${data.final_qualified ? 'status-qualified' : 'status-unqualified'}">
                        ${data.final_qualified ? '✓ 已合格' : '✗ 未合格'}
                    </span>
                </div>
            `;
            
            return html;
        }

        loadMyCredits();
    </script>
</body>
</html>
