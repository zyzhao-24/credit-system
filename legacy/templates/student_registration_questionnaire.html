<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>我的注册问卷 - 团校积分系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/win11-additions.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>我的注册问卷</h1>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.location.href='/student'" class="secondary">返回首页</button>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>

        <div class="content">
            <div class="info-card">
                <h3>基本信息</h3>
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="studentId" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="name" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label>手机号 <span style="color: red;">*</span></label>
                    <input type="tel" id="phone" pattern="[0-9]{11}" placeholder="请输入11位手机号">
                    <small style="color: #666;">用于活动报名，请务必填写</small>
                </div>
                <div class="form-group">
                    <label>微信号 <span style="color: red;">*</span></label>
                    <input type="text" id="wechat" placeholder="请输入微信号">
                    <small style="color: #666;">用于活动报名，请务必填写</small>
                </div>
                <div class="form-group">
                    <label>建议</label>
                    <textarea id="suggestion" rows="4" placeholder="对团校活动的建议（选填）"></textarea>
                </div>
                <div class="form-group">
                    <label>提交时间</label>
                    <input type="text" id="submitTime" readonly style="background: #f5f5f5;">
                </div>
                <button onclick="saveQuestionnaire()" style="width: 100%;">保存</button>
            </div>
        </div>
    </div>

    <script>
        let questionnaireId = '';

        async function loadQuestionnaire() {
            try {
                const response = await fetch('/api/student/registration_questionnaire');
                const data = await response.json();
                
                if (data.success) {
                    const q = data.questionnaire;
                    questionnaireId = q.questionnaire_id;
                    document.getElementById('studentId').value = q.student_id;
                    document.getElementById('name').value = q.name;
                    document.getElementById('phone').value = q.phone || '';
                    document.getElementById('wechat').value = q.wechat || '';
                    document.getElementById('suggestion').value = q.suggestion || '';
                    document.getElementById('submitTime').value = q.submit_time;
                } else {
                    alert('加载失败：' + data.message);
                }
            } catch (error) {
                alert('加载失败：' + error.message);
                console.error('加载错误:', error);
            }
        }

        async function saveQuestionnaire() {
            const phone = document.getElementById('phone').value.trim();
            const wechat = document.getElementById('wechat').value.trim();
            const suggestion = document.getElementById('suggestion').value.trim();
            
            // 验证手机号
            if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入正确的11位手机号码');
                return;
            }
            
            try {
                const response = await fetch('/api/student/registration_questionnaire', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        phone: phone,
                        wechat: wechat,
                        suggestion: suggestion
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('保存成功！');
                    loadQuestionnaire();
                } else {
                    alert('保存失败：' + result.message);
                }
            } catch (error) {
                alert('保存失败：' + error.message);
            }
        }

        async function logout() {
            const response = await fetch('/api/logout', {method: 'POST'});
            window.location.href = '/';
        }

        // 页面加载时获取数据
        loadQuestionnaire();
    </script>
</body>
</html>
