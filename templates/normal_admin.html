<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>管理员界面 - 团校积分系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/win11-additions.css">
    <link rel="stylesheet" href="/static/css/admin-theme.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>管理员控制台</h1>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('students')">学生列表</button>
            <button class="tab" onclick="switchTab('activities')">活动管理</button>
            <button class="tab" onclick="switchTab('report')">数据报表</button>
        </div>

        <!-- 学生列表 -->
        <div id="students" class="tab-content active">
            <h2>学生列表</h2>
            <div style="margin-bottom: 12px;">
                <input type="text" id="studentSearchInput" placeholder="搜索学号或姓名..." 
                       oninput="filterStudents()" style="max-width: 300px;">
            </div>
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 活动管理 -->
        <div id="activities" class="tab-content">
            <h2>活动列表</h2>
            <div class="button-group">
                <button class="add-btn" onclick="showAddActivityModal()">➕ 创建活动</button>
            </div>
            <div id="activitiesList"></div>
        </div>
        
        <!-- 数据报表 -->
        <div id="report" class="tab-content">
            <h2>数据报表</h2>
            <div id="reportContent"></div>
        </div>
    </div>

    <!-- 添加活动模态框 -->
    <div id="addActivityModal" class="modal">
        <div class="modal-content">
            <h2>创建活动</h2>
            <div class="form-group">
                <label>活动名称</label>
                <input type="text" id="newActivityName">
            </div>
            <div class="form-group">
                <label>负责部门（可多选）</label>
                <div id="activityDepartmentsCheckbox" class="checkbox-group"></div>
            </div>
            <div class="form-group">
                <label>活动类别（可多选）</label>
                <div id="activityCategoriesCheckbox" class="checkbox-group"></div>
            </div>
            <button class="add-btn" onclick="addActivity()">创建</button>
            <button class="secondary" onclick="closeModal('addActivityModal')">取消</button>
        </div>
    </div>

    <!-- 修改活动类别模态框 -->
    <div id="editActivityCategoriesModal" class="modal">
        <div class="modal-content">
            <h2>修改活动类别</h2>
            <input type="hidden" id="editActivityId">
            <div class="form-group">
                <label>活动名称</label>
                <input type="text" id="editActivityName" readonly>
            </div>
            <div class="form-group">
                <label>活动类别（可多选）</label>
                <div id="editActivityCategoriesCheckbox" class="checkbox-group"></div>
            </div>
            <button onclick="saveActivityCategories()">保存</button>
            <button class="secondary" onclick="closeModal('editActivityCategoriesModal')">取消</button>
        </div>
    </div>

    <!-- 添加记录模态框 -->
    <div id="addRecordModal" class="modal">
        <div class="modal-content">
            <h2>添加记录</h2>
            <input type="hidden" id="recordActivityId">
            <div class="form-group">
                <label>记录名称</label>
                <input type="text" id="newRecordName">
            </div>
            <button class="add-btn" onclick="addRecord()">添加</button>
            <button class="secondary" onclick="closeModal('addRecordModal')">取消</button>
        </div>
    </div>

    <!-- 修改记录名称模态框 -->
    <div id="editRecordModal" class="modal">
        <div class="modal-content">
            <h2>修改记录名称</h2>
            <input type="hidden" id="editRecordId">
            <input type="hidden" id="editRecordActivityId">
            <div class="form-group">
                <label>记录名称</label>
                <input type="text" id="editRecordName">
            </div>
            <button class="add-btn" onclick="updateRecordName()">保存</button>
            <button class="secondary" onclick="closeModal('editRecordModal')">取消</button>
        </div>
    </div>

    <!-- 记录详情模态框 -->
    <div id="recordDetailModal" class="modal">
        <div class="modal-content" style="max-width: 900px; max-height: 85vh; display: flex; flex-direction: column;">
            <h2 id="recordDetailTitle">记录详情</h2>
            <input type="hidden" id="detailRecordId">
            <div style="margin-bottom: 16px;">
                <button class="add-btn" onclick="showBatchEntryModal()">批量添加条目</button>
                <button onclick="showBatchUpdateModal()">批量修改选中</button>
                <button class="danger" onclick="batchDeleteSelectedEntries()">批量删除选中</button>
            </div>
            <div id="recordDetailContent" style="overflow-y: auto; flex: 1;"></div>
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.1);">
                <button class="secondary" onclick="closeModal('recordDetailModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 批量添加条目模态框 -->
    <div id="batchEntryModal" class="modal">
        <div class="modal-content">
            <h2>批量添加条目</h2>
            <p>格式：姓名或学号 或 姓名或学号,学分（每行一个条目）</p>
            <p style="font-size: 12px; color: #616161;">
                • 纯数字视为学号，无论学生是否存在都保留<br>
                • 非数字视为姓名，匹配系统中的学生，无匹配则忽略<br>
                • 多个同名学生都会被匹配<br>
                • 如果不带学分，使用下方默认学分
            </p>
            <div class="form-group">
                <label>默认学分</label>
                <input type="number" id="defaultCredits" value="0" step="0.1" style="max-width: 200px;">
            </div>
            <div class="form-group">
                <label>类别选择（可多选）</label>
                <div id="batchEntryCategoriesCheckbox" class="checkbox-group"></div>
            </div>
            <div class="form-group">
                <label>条目数据</label>
                <textarea id="batchEntryData" rows="10" placeholder="2021001,2&#10;张三,3&#10;李四&#10;王五"></textarea>
            </div>
            <button class="add-btn" onclick="batchAddEntries()">添加</button>
            <button class="secondary" onclick="closeModal('batchEntryModal')">取消</button>
        </div>
    </div>
    
    <!-- 批量修改条目模态框 -->
    <div id="batchUpdateModal" class="modal">
        <div class="modal-content">
            <h2>批量修改条目</h2>
            <input type="hidden" id="batchUpdateRecordId">
            <div class="form-group">
                <label>新学分（留空则不修改）</label>
                <input type="number" id="batchUpdateCredits" step="0.1" placeholder="留空不修改">
            </div>
            <div class="form-group">
                <label>新类别（不选则不修改）</label>
                <div id="batchUpdateCategoriesCheckbox" class="checkbox-group"></div>
            </div>
            <button onclick="batchUpdateEntries()">修改</button>
            <button class="secondary" onclick="closeModal('batchUpdateModal')">取消</button>
        </div>
    </div>

    <!-- 编辑单个条目模态框 -->
    <div id="editEntryModal" class="modal">
        <div class="modal-content">
            <h2>编辑条目</h2>
            <input type="hidden" id="editEntryRecordId">
            <input type="hidden" id="editEntryStudentId">
            <div class="form-group">
                <label>学号</label>
                <input type="text" id="editEntryStudentIdDisplay" readonly>
            </div>
            <div class="form-group">
                <label>学分</label>
                <input type="number" id="editEntryCredits" step="0.1">
            </div>
            <div class="form-group">
                <label>类别（可多选）</label>
                <div id="editEntryCategoriesCheckbox" class="checkbox-group"></div>
            </div>
            <button onclick="saveEditEntry()">保存</button>
            <button class="secondary" onclick="closeModal('editEntryModal')">取消</button>
        </div>
    </div>

    <script src="/static/js/normal_admin.js"></script>
</body>
</html>
