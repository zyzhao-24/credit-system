<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>注册问卷管理 - 团校积分系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/win11-additions.css">
    <link rel="stylesheet" href="/static/css/admin-theme.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>问卷管理</h1>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.location.href='/admin'" class="secondary">返回管理后台</button>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>

        <div class="content">
            <!-- 注册问卷部分 -->
            <div style="margin-bottom: 40px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="cursor: pointer;" onclick="toggleAllRegistrationQuestionnaires()">
                        <span id="regToggleIcon">▶</span> 注册问卷
                    </h2>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="regSearchInput" placeholder="搜索学号、姓名、手机号..." 
                               oninput="filterRegistrationQuestionnaires()" style="width: 250px;">
                        <button onclick="exportRegistrationCSV()" class="success">📥 导出CSV</button>
                    </div>
                </div>

                <div id="regContent" style="display: none;">
                    <div id="regStats" style="margin-bottom: 15px; padding: 12px; background: #e3f2fd; border-radius: 8px; border-left: 4px solid #2196F3;">
                        <strong>统计：</strong>
                        <span id="regTotalCount">总数：0</span>
                        <span style="margin-left: 20px;" id="regFilteredCount"></span>
                    </div>

                    <div id="regQuestionnairesContainer"></div>
                </div>
            </div>

            <!-- 活动问卷模板部分 -->
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>活动问卷模板</h2>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="showCreateQuestionnaireTemplateModal()" class="add-btn">➕ 创建问卷</button>
                        <input type="text" id="actSearchInput" placeholder="搜索问卷标题、活动名称..." 
                               oninput="filterActivityQuestionnaires()" style="width: 250px;">
                    </div>
                </div>

                <div id="actStats" style="margin-bottom: 15px; padding: 12px; background: #fff3e0; border-radius: 8px; border-left: 4px solid #ff9800;">
                    <strong>统计：</strong>
                    <span id="actTotalCount">总数：0</span>
                    <span style="margin-left: 20px;" id="actFilteredCount"></span>
                </div>

                <div id="actQuestionnairesContainer"></div>
            </div>
        </div>
    </div>

    <!-- 创建问卷模板模态框 -->
    <div id="createQuestionnaireTemplateModal" class="modal">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <h2>创建活动问卷</h2>
            <div class="form-group">
                <label>选择活动</label>
                <select id="templateActivityId">
                    <option value="">请选择活动</option>
                </select>
            </div>
            <div class="form-group">
                <label>问卷标题</label>
                <input type="text" id="templateTitle" placeholder="例如：初级团校报名问卷">
            </div>
            <div class="form-group">
                <label>开始时间</label>
                <input type="datetime-local" id="templateStartTime">
            </div>
            <div class="form-group">
                <label>结束时间</label>
                <input type="datetime-local" id="templateEndTime">
            </div>
            <div class="form-group">
                <label>最大报名人数（0表示不限制）</label>
                <input type="number" id="templateMaxParticipants" min="0" value="0">
            </div>
            <div style="padding: 10px; background: #e3f2fd; border-radius: 4px; margin-bottom: 10px;">
                <strong>固定题目：</strong>意向学分类别（单选，必填）
            </div>
            
            <!-- 自定义题目编辑器 -->
            <div style="margin-top: 20px; border-top: 2px solid #e0e0e0; padding-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;">自定义题目</h3>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="addQuestion('description')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 说明</button>
                        <button onclick="addQuestion('single_choice')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 单选</button>
                        <button onclick="addQuestion('multiple_choice')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 多选</button>
                        <button onclick="addQuestion('text')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 填空</button>
                        <button onclick="addQuestion('textarea')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 简答</button>
                    </div>
                </div>
                <div id="customQuestionsEditor" style="max-height: 400px; overflow-y: auto;">
                    <!-- 题目列表将在这里动态生成 -->
                </div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="createQuestionnaireTemplate()" style="flex: 1;">创建</button>
                <button class="secondary" onclick="closeModal('createQuestionnaireTemplateModal')" style="flex: 1;">取消</button>
            </div>
        </div>
    </div>

    <!-- 编辑问卷模态框 -->
    <div id="editQuestionnaireModal" class="modal">
        <div class="modal-content">
            <h2>编辑问卷</h2>
            <input type="hidden" id="editQuestionnaireId">
            <input type="hidden" id="editQuestionnaireType">
            <div class="form-group">
                <label>学号（只读）</label>
                <input type="text" id="editStudentId" readonly style="background: #f5f5f5;">
            </div>
            <div class="form-group">
                <label>姓名（只读）</label>
                <input type="text" id="editName" readonly style="background: #f5f5f5;">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="editPhone" pattern="[0-9]{11}">
            </div>
            <div class="form-group">
                <label>微信号</label>
                <input type="text" id="editWechat">
            </div>
            <div id="registrationFields" style="display: none;">
                <div class="form-group">
                    <label>建议</label>
                    <textarea id="editSuggestion" rows="3"></textarea>
                </div>
            </div>
            <div id="activityFields" style="display: none;">
                <div class="form-group">
                    <label>活动</label>
                    <input type="text" id="editActivityName" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="editStatus">
                        <option value="active">已报名</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveQuestionnaire()" style="flex: 1;">保存</button>
                <button class="secondary" onclick="closeModal('editQuestionnaireModal')" style="flex: 1;">取消</button>
            </div>
        </div>
    </div>

    <!-- 编辑问卷模板模态框 -->
    <div id="editTemplateModal" class="modal">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <h2>编辑问卷模板</h2>
            <input type="hidden" id="editTemplateId">
            <div class="form-group">
                <label>活动（只读）</label>
                <input type="text" id="editTemplateActivityName" readonly style="background: #f5f5f5;">
            </div>
            <div class="form-group">
                <label>问卷标题</label>
                <input type="text" id="editTemplateTitle" placeholder="例如：初级团校报名问卷">
            </div>
            <div class="form-group">
                <label>开始时间</label>
                <input type="datetime-local" id="editTemplateStartTime">
            </div>
            <div class="form-group">
                <label>结束时间</label>
                <input type="datetime-local" id="editTemplateEndTime">
            </div>
            <div class="form-group">
                <label>最大报名人数（0表示不限制）</label>
                <input type="number" id="editTemplateMaxParticipants" min="0" value="0">
            </div>
            <div style="padding: 10px; background: #e3f2fd; border-radius: 4px; margin-bottom: 10px;">
                <strong>固定题目：</strong>意向学分类别（单选，必填）
            </div>
            
            <!-- 自定义题目编辑器 -->
            <div style="margin-top: 20px; border-top: 2px solid #e0e0e0; padding-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;">自定义题目</h3>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="addQuestionToEdit('description')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 说明</button>
                        <button onclick="addQuestionToEdit('single_choice')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 单选</button>
                        <button onclick="addQuestionToEdit('multiple_choice')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 多选</button>
                        <button onclick="addQuestionToEdit('text')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 填空</button>
                        <button onclick="addQuestionToEdit('textarea')" class="secondary" style="padding: 6px 12px; font-size: 13px;">➕ 简答</button>
                    </div>
                </div>
                <div id="editCustomQuestionsEditor" style="max-height: 400px; overflow-y: auto;">
                    <!-- 题目列表将在这里动态生成 -->
                </div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveTemplate()" style="flex: 1;">保存</button>
                <button class="secondary" onclick="closeModal('editTemplateModal')" style="flex: 1;">取消</button>
            </div>
        </div>
    </div>

    <!-- 查看报名详情模态框 -->
    <div id="viewResponseModal" class="modal">
        <div class="modal-content" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
            <h2>报名详情</h2>
            <div id="responseDetailContent"></div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="secondary" onclick="closeModal('viewResponseModal')" style="flex: 1;">关闭</button>
            </div>
        </div>
    </div>

    <!-- 编辑报名记录模态框 -->
    <div id="editResponseModal" class="modal">
        <div class="modal-content">
            <h2>编辑报名记录</h2>
            <input type="hidden" id="editResponseId">
            <input type="hidden" id="editResponseQuestionnaireId">
            <div class="form-group">
                <label>学号（只读）</label>
                <input type="text" id="editResponseStudentId" readonly style="background: #f5f5f5;">
            </div>
            <div class="form-group">
                <label>姓名（只读）</label>
                <input type="text" id="editResponseStudentName" readonly style="background: #f5f5f5;">
            </div>
            <div class="form-group">
                <label>手机号 <span style="color: red;">*</span></label>
                <input type="tel" id="editResponsePhone" pattern="[0-9]{11}" placeholder="请输入11位手机号">
            </div>
            <div class="form-group">
                <label>微信号 <span style="color: red;">*</span></label>
                <input type="text" id="editResponseWechat" placeholder="请输入微信号">
            </div>
            <div class="form-group">
                <label>意向学分类别 <span style="color: red;">*</span></label>
                <select id="editResponseCategory">
                    <option value="">请选择意向类别</option>
                </select>
            </div>
            <div class="form-group">
                <label>提交时间（只读）</label>
                <input type="text" id="editResponseSubmitTime" readonly style="background: #f5f5f5;">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveResponse()" style="flex: 1;">保存</button>
                <button class="secondary" onclick="closeModal('editResponseModal')" style="flex: 1;">取消</button>
            </div>
        </div>
    </div>

    <script>
        let allRegistrationQuestionnaires = [];
        let filteredRegistrationQuestionnaires = [];
        let allActivityQuestionnaires = [];
        let filteredActivityQuestionnaires = [];
        let activities = {};
        let students = {};

        async function loadQuestionnaires() {
            try {
                // 加载活动列表
                const activitiesResponse = await fetch('/api/admin/activities');
                const activitiesData = await activitiesResponse.json();
                if (activitiesData.success) {
                    activitiesData.activities.forEach(a => {
                        activities[a.activity_id] = a.name;
                    });
                }

                // 加载学生列表
                const studentsResponse = await fetch('/api/admin/students');
                const studentsData = await studentsResponse.json();
                if (studentsData.success) {
                    studentsData.students.forEach(s => {
                        students[s.student_id] = s.name;
                    });
                }

                // 加载所有问卷
                const response = await fetch('/api/admin/questionnaires/all');
                const data = await response.json();

                if (data.success) {
                    // 分离注册问卷和活动问卷模板
                    allRegistrationQuestionnaires = data.questionnaires.filter(q => q.questionnaire_type === 'registration');
                    allActivityQuestionnaires = data.questionnaires.filter(q => q.questionnaire_type === 'activity_template');
                    
                    filteredRegistrationQuestionnaires = allRegistrationQuestionnaires;
                    filteredActivityQuestionnaires = allActivityQuestionnaires;
                    
                    renderRegistrationQuestionnaires();
                    renderActivityQuestionnaires();
                    updateStats();
                } else {
                    alert('加载失败：' + data.message);
                }
            } catch (error) {
                alert('加载失败：' + error.message);
                console.error('加载错误:', error);
            }
        }

        function renderQuestionnaires() {
            const tbody = document.getElementById('questionnairesBody');
            
            if (filteredQuestionnaires.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 40px; color: #999;">
                            ${allQuestionnaires.length === 0 ? '暂无问卷记录' : '没有符合条件的记录'}
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = '';
            filteredQuestionnaires.forEach((q, index) => {
                const tr = document.createElement('tr');
                const typeText = q.questionnaire_type === 'registration' ? '注册问卷' : '活动问卷';
                const typeBadge = q.questionnaire_type === 'registration' ? 
                    '<span class="status-badge" style="background: #e3f2fd; color: #1565c0;">注册</span>' :
                    '<span class="status-badge" style="background: #fff3e0; color: #e65100;">活动</span>';
                
                let remark = '-';
                if (q.questionnaire_type === 'registration') {
                    remark = q.suggestion || '-';
                } else {
                    const activityName = activities[q.activity_id] || '未知活动';
                    const statusText = q.status === 'active' ? '已报名' : '已取消';
                    remark = `${activityName} (${statusText})`;
                }
                
                tr.innerHTML = `
                    <td style="text-align: center;">${index + 1}</td>
                    <td>${typeBadge}</td>
                    <td>${q.student_id}</td>
                    <td>${q.name}</td>
                    <td>${q.phone || '-'}</td>
                    <td>${q.wechat || '-'}</td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" 
                        title="${remark}">${remark}</td>
                    <td>${q.submit_time}</td>
                    <td>
                        <button class="secondary" onclick="editQuestionnaire('${q.questionnaire_id}')" style="padding: 4px 8px; font-size: 12px;">编辑</button>
                        <button class="danger" onclick="deleteQuestionnaire('${q.questionnaire_id}')" style="padding: 4px 8px; font-size: 12px;">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterQuestionnaires() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const typeFilter = document.getElementById('typeFilter').value;
            
            filteredQuestionnaires = allQuestionnaires.filter(q => {
                const matchQuery = !query || 
                    q.student_id.toLowerCase().includes(query) ||
                    q.name.toLowerCase().includes(query) ||
                    (q.phone && q.phone.includes(query)) ||
                    (q.wechat && q.wechat.toLowerCase().includes(query));
                
                const matchType = !typeFilter || q.questionnaire_type === typeFilter;
                
                return matchQuery && matchType;
            });
            
            renderQuestionnaires();
            updateStats();
        }

        function updateStats() {
            const regCount = allQuestionnaires.filter(q => q.questionnaire_type === 'registration').length;
            const actCount = allQuestionnaires.filter(q => q.questionnaire_type === 'activity').length;
            
            document.getElementById('totalCount').textContent = 
                `总数：${allQuestionnaires.length} (注册：${regCount}, 活动：${actCount})`;
            
            const filteredCountEl = document.getElementById('filteredCount');
            if (filteredQuestionnaires.length !== allQuestionnaires.length) {
                filteredCountEl.textContent = `筛选结果：${filteredQuestionnaires.length}`;
                filteredCountEl.style.display = 'inline';
            } else {
                filteredCountEl.style.display = 'none';
            }
        }

        function editQuestionnaire(questionnaireId) {
            const q = allQuestionnaires.find(item => item.questionnaire_id === questionnaireId);
            if (!q) return;
            
            document.getElementById('editQuestionnaireId').value = q.questionnaire_id;
            document.getElementById('editQuestionnaireType').value = q.questionnaire_type;
            document.getElementById('editStudentId').value = q.student_id;
            document.getElementById('editName').value = q.name;
            document.getElementById('editPhone').value = q.phone || '';
            document.getElementById('editWechat').value = q.wechat || '';
            
            if (q.questionnaire_type === 'registration') {
                document.getElementById('registrationFields').style.display = 'block';
                document.getElementById('activityFields').style.display = 'none';
                document.getElementById('editSuggestion').value = q.suggestion || '';
            } else {
                document.getElementById('registrationFields').style.display = 'none';
                document.getElementById('activityFields').style.display = 'block';
                document.getElementById('editActivityName').value = activities[q.activity_id] || '未知活动';
                document.getElementById('editStatus').value = q.status || 'active';
            }
            
            showModal('editQuestionnaireModal');
        }

        async function saveQuestionnaire() {
            const questionnaireId = document.getElementById('editQuestionnaireId').value;
            const questionnaireType = document.getElementById('editQuestionnaireType').value;
            const phone = document.getElementById('editPhone').value.trim();
            const wechat = document.getElementById('editWechat').value.trim();
            
            // 验证手机号
            if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入正确的11位手机号码');
                return;
            }
            
            const data = {
                questionnaire_id: questionnaireId,
                phone: phone,
                wechat: wechat
            };
            
            if (questionnaireType === 'registration') {
                data.suggestion = document.getElementById('editSuggestion').value.trim();
            } else {
                data.status = document.getElementById('editStatus').value;
            }
            
            try {
                const response = await fetch('/api/admin/questionnaire/update', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('保存成功');
                    closeModal('editQuestionnaireModal');
                    loadQuestionnaires();
                } else {
                    alert('保存失败：' + result.message);
                }
            } catch (error) {
                alert('保存失败：' + error.message);
            }
        }

        async function deleteQuestionnaire(questionnaireId) {
            if (!confirm('确定要删除这条问卷记录吗？')) return;
            
            try {
                const response = await fetch(`/api/admin/questionnaire/${questionnaireId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('删除成功');
                    loadQuestionnaires();
                } else {
                    alert('删除失败：' + result.message);
                }
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }

        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function exportCSV() {
            const typeFilter = document.getElementById('typeFilter').value;
            let url = '/api/admin/questionnaires/export';
            if (typeFilter) {
                url += '?type=' + typeFilter;
            }
            window.location.href = url;
        }

        async function logout() {
            const response = await fetch('/api/logout', {method: 'POST'});
            const data = await response.json();
            if (data.admin_login_path) {
                window.location.href = '/' + data.admin_login_path;
            } else {
                window.location.href = '/';
            }
        }

        // 渲染注册问卷（整个问卷折叠）
        function renderRegistrationQuestionnaires() {
            const container = document.getElementById('regQuestionnairesContainer');
            
            if (filteredRegistrationQuestionnaires.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #999;">
                        <div style="font-size: 48px; margin-bottom: 20px;">📝</div>
                        <div style="font-size: 18px;">${allRegistrationQuestionnaires.length === 0 ? '暂无注册问卷' : '没有符合条件的记录'}</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            filteredRegistrationQuestionnaires.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'questionnaire-card';
                card.style.cssText = 'background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer;';
                
                card.innerHTML = `
                    <div onclick="toggleRegCard('${q.questionnaire_id}')">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 style="margin: 0; color: #1976d2;">
                                <span id="reg-toggle-icon-${q.questionnaire_id}">▶</span> ${q.student_id} - ${q.name}
                            </h3>
                            <span style="color: #666; font-size: 14px;">${q.submit_time}</span>
                        </div>
                    </div>
                    <div id="reg-content-${q.questionnaire_id}" style="display: none; margin-top: 15px; border-top: 2px solid #e0e0e0; padding-top: 15px;" onclick="event.stopPropagation()">
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 15px;">
                            <div>
                                <strong>手机号：</strong>${q.phone || '-'}
                            </div>
                            <div>
                                <strong>微信号：</strong>${q.wechat || '-'}
                            </div>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <strong>建议：</strong>
                            <div style="margin-top: 5px; padding: 10px; background: #f5f5f5; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; word-break: break-word; overflow-wrap: break-word;">
                                ${q.suggestion || '无'}
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button class="secondary" onclick="editRegistrationQuestionnaire('${q.questionnaire_id}')" style="padding: 6px 12px;">编辑</button>
                            <button class="danger" onclick="deleteQuestionnaire('${q.questionnaire_id}')" style="padding: 6px 12px;">删除</button>
                        </div>

        async function createQuestionnaireTemplate() {
            const activityId = document.getElementById('templateActivityId').value;
            const title = document.getElementById('templateTitle').value.trim();
            const startTime = document.getElementById('templateStartTime').value;
            const endTime = document.getElementById('templateEndTime').value;
            const maxParticipants = parseInt(document.getElementById('templateMaxParticipants').value);
            
            if (!activityId) {
                alert('请选择活动');
                return;
            }
            
            if (!title) {
                alert('请输入问卷标题');
                return;
            }
            
            if (!startTime || !endTime) {
                alert('请设置问卷时间');
                return;
            }
            
            // 验证自定义题目
            for (let i = 0; i < customQuestions.length; i++) {
                const q = customQuestions[i];
                if (!q.question_text.trim()) {
                    alert(`题目${i + 1}的文本不能为空`);
                    return;
                }
                if (q.question_type.includes('choice') && q.options.length < 2) {
                    alert(`题目${i + 1}至少需要2个选项`);
                    return;
                }
            }
            
            try {
                const response = await fetch('/api/admin/questionnaire/create_template', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        activity_id: activityId,
                        title: title,
                        start_time: startTime,
                        end_time: endTime,
                        max_participants: maxParticipants,
                        custom_questions: customQuestions
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('创建成功');
                    customQuestions = [];
                    closeModal('createQuestionnaireTemplateModal');
                    loadQuestionnaires();
                } else {
                    alert('创建失败：' + result.message);
                }
            } catch (error) {
                alert('创建失败：' + error.message);
            }
        }

            }
        }

        async function viewResponseDetail(responseId, questionnaireId) {
            // 从缓存中查找response

                response = responsesCache[questionnaireId].find(r => r.response_id === responseId);

            // 获取问卷信息
            const questionnaire = allActivityQuestionnaires.find(q => q.questionnaire_id === questionnaireId);
            if (!questionnaire) {
                alert('问卷不存在');
                return;
            }
            
            // 构建详情HTML
            let html = `
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px;">
                    <div><strong>学号：</strong>${response.student_id}</div>
                    <div><strong>姓名：</strong>${response.student_name}</div>

                    <div><strong>意向类别：</strong>${response.intended_category || '-'}</div>

                    <div><strong>排名：</strong>${response.rank > 0 ? response.rank : '-'}</div>

            // 显示自定义答案
            if (questionnaire.custom_questions && questionnaire.custom_questions.length > 0) {

                questionnaire.custom_questions.forEach((question, index) => {

                    const answer = response.custom_answers && response.custom_answers[question.question_id] 
                        ? response.custom_answers[question.question_id].answer

                    html += `

            }
            
            if (!wechat) {
                alert('请输入微信号');
                return;
            }
            
            if (!category) {
                alert('请选择意向类别');
                return;
            }
            
            try {
                const res = await fetch(`/api/admin/questionnaire/response/${responseId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        phone: phone,
                        wechat: wechat,
                        intended_category: category
                    })
                });
                
                const result = await res.json();
                if (result.success) {
                    alert('修改成功');
                    closeModal('editResponseModal');
                    
                    // 清除缓存并重新加载
                    delete responsesCache[questionnaireId];
                    await loadResponses(questionnaireId);
                    
                    // 重新加载问卷列表以更新统计信息
                    await loadQuestionnaires();
                    
                    // 如果问卷是展开的，保持展开状态
                    if (expandedQuestionnaires[questionnaireId]) {
                        const responsesDiv = document.getElementById(`responses-${questionnaireId}`);
                        if (responsesDiv) {
                            responsesDiv.style.display = 'block';
                        }
                    }
                } else {
                    alert('修改失败：' + result.message);
                }
            } catch (error) {
                alert('修改失败：' + error.message);
            }
        }

        async function deleteResponse(responseId, questionnaireId) {
            if (!confirm('确定要删除这条报名记录吗？')) return;
            
            try {
                const response = await fetch(`/api/admin/questionnaire/response/${responseId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('删除成功');
                    // 清除缓存并重新加载
                    delete responsesCache[questionnaireId];
                    await loadResponses(questionnaireId);
                    // 重新加载问卷列表以更新计数
                    await loadQuestionnaires();
                    // 如果问卷是展开的，保持展开状态
                    if (expandedQuestionnaires[questionnaireId]) {
                        const responsesDiv = document.getElementById(`responses-${questionnaireId}`);
                        const toggleIcon = document.getElementById(`toggle-icon-${questionnaireId}`);
                        if (responsesDiv && toggleIcon) {
                            responsesDiv.style.display = 'block';
                            toggleIcon.textContent = '▼';
                        }
                    }
                } else {
                    alert('删除失败：' + result.message);
                }
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }



        function exportRegistrationCSV() {
            window.location.href = '/api/admin/questionnaires/export?type=registration';
        }



        // ========== 自定义题目编辑器 ==========
        
        let customQuestions = [];
        let editCustomQuestions = [];
        
        function addQuestion(type) {
            const question = {
                question_id: '',
                question_type: type,
                question_text: '',
                required: false,
                options: type.includes('choice') ? ['选项1', '选项2'] : [],
                max_length: type === 'text' ? 200 : (type === 'textarea' ? 500 : 0),
                order: customQuestions.length + 1
            };
            customQuestions.push(question);
            renderQuestions();
        }
        
        function addQuestionToEdit(type) {
            const question = {
                question_id: '',
                question_type: type,
                question_text: '',
                required: false,
                options: type.includes('choice') ? ['选项1', '选项2'] : [],
                max_length: type === 'text' ? 200 : (type === 'textarea' ? 500 : 0),
                order: editCustomQuestions.length + 1
            };
            editCustomQuestions.push(question);
            renderEditQuestions();
        }
        
        function renderQuestions() {
            const container = document.getElementById('customQuestionsEditor');
            if (customQuestions.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">暂无自定义题目</div>';
                return;
            }
            
            container.innerHTML = '';
            customQuestions.forEach((q, index) => {
                const questionCard = createQuestionCard(q, index, false);
                container.appendChild(questionCard);
            });
        }
        
        function renderEditQuestions() {
            const container = document.getElementById('editCustomQuestionsEditor');
            if (editCustomQuestions.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">暂无自定义题目</div>';
                return;
            }
            
            container.innerHTML = '';
            editCustomQuestions.forEach((q, index) => {
                const questionCard = createQuestionCard(q, index, true);
                container.appendChild(questionCard);
            });
        }
        
        function createQuestionCard(question, index, isEdit) {
            const card = document.createElement('div');
            card.style.cssText = 'border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: white;';
            
            const typeNames = {
                'description': '说明文字',
                'single_choice': '单选题',
                'multiple_choice': '多选题',
                'text': '填空题',
                'textarea': '简答题'
            };
            
            let html = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <strong style="color: #1976d2;">题目 ${index + 1} - ${typeNames[question.question_type]}</strong>
                    <div style="display: flex; gap: 5px;">
                        ${index > 0 ? `<button onclick="${isEdit ? 'moveEditQuestion' : 'moveQuestion'}(${index}, -1)" class="secondary" style="padding: 4px 8px; font-size: 12px;">↑</button>` : ''}
                        ${index < (isEdit ? editCustomQuestions : customQuestions).length - 1 ? `<button onclick="${isEdit ? 'moveEditQuestion' : 'moveQuestion'}(${index}, 1)" class="secondary" style="padding: 4px 8px; font-size: 12px;">↓</button>` : ''}
                        <button onclick="${isEdit ? 'removeEditQuestion' : 'removeQuestion'}(${index})" class="danger" style="padding: 4px 8px; font-size: 12px;">删除</button>
                    </div>
                </div>
                
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px;">题目文本：</label>
                    <textarea onchange="${isEdit ? 'updateEditQuestion' : 'updateQuestion'}(${index}, 'question_text', this.value)" 
                              rows="2" 
                              style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">${question.question_text}</textarea>
                </div>
            `;
            
            if (question.question_type !== 'description') {
                html += `
                    <div style="margin-bottom: 10px;">
                        <label style="display: flex; align-items: center; cursor: pointer;">
                            <input type="checkbox" 
                                   ${question.required ? 'checked' : ''} 
                                   onchange="${isEdit ? 'updateEditQuestion' : 'updateQuestion'}(${index}, 'required', this.checked)"
                                   style="margin-right: 8px;">
                            <span>必填</span>
                        </label>
                    </div>
                `;
            }
            
            if (question.question_type.includes('choice')) {
                html += `
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; margin-bottom: 5px;">选项：</label>
                        <div id="${isEdit ? 'edit' : ''}options_${index}">
                            ${question.options.map((opt, optIndex) => `
                                <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                                    <input type="text" value="${opt}" 
                                           onchange="${isEdit ? 'updateEditOption' : 'updateOption'}(${index}, ${optIndex}, this.value)"
                                           style="flex: 1; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                                    <button onclick="${isEdit ? 'removeEditOption' : 'removeOption'}(${index}, ${optIndex})" 
                                            class="danger" style="padding: 4px 8px; font-size: 12px;">✕</button>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="${isEdit ? 'addEditOption' : 'addOption'}(${index})" 
                                class="secondary" style="padding: 4px 8px; font-size: 12px; margin-top: 5px;">➕ 添加选项</button>
                    </div>
                `;
            }
            
            if (question.question_type === 'text' || question.question_type === 'textarea') {
                html += `
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; margin-bottom: 5px;">最大字符数：</label>
                        <input type="number" value="${question.max_length}" min="1" max="5000"
                               onchange="${isEdit ? 'updateEditQuestion' : 'updateQuestion'}(${index}, 'max_length', parseInt(this.value))"
                               style="width: 100px; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                    </div>
                `;
            }
            
            card.innerHTML = html;
            return card;
        }
        
        function updateQuestion(index, field, value) {
            customQuestions[index][field] = value;
        }
        
        function updateEditQuestion(index, field, value) {
            editCustomQuestions[index][field] = value;
        }
        
        function updateOption(qIndex, optIndex, value) {
            customQuestions[qIndex].options[optIndex] = value;
        }
        
        function updateEditOption(qIndex, optIndex, value) {
            editCustomQuestions[qIndex].options[optIndex] = value;
        }
        
        function addOption(index) {
            customQuestions[index].options.push('新选项');
            renderQuestions();
        }
        
        function addEditOption(index) {
            editCustomQuestions[index].options.push('新选项');
            renderEditQuestions();
        }
        
        function removeOption(qIndex, optIndex) {
            if (customQuestions[qIndex].options.length <= 2) {
                alert('至少需要2个选项');
                return;
            }
            customQuestions[qIndex].options.splice(optIndex, 1);
            renderQuestions();
        }
        
        function removeEditOption(qIndex, optIndex) {
            if (editCustomQuestions[qIndex].options.length <= 2) {
                alert('至少需要2个选项');
                return;
            }
            editCustomQuestions[qIndex].options.splice(optIndex, 1);
            renderEditQuestions();
        }
        
        function removeQuestion(index) {
            if (confirm('确定删除这个题目吗？')) {
                customQuestions.splice(index, 1);
                renderQuestions();
            }
        }
        
        function removeEditQuestion(index) {
            if (confirm('确定删除这个题目吗？')) {
                editCustomQuestions.splice(index, 1);
                renderEditQuestions();
            }
        }
        
        function moveQuestion(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= customQuestions.length) return;
            [customQuestions[index], customQuestions[newIndex]] = [customQuestions[newIndex], customQuestions[index]];
            renderQuestions();
        }
        
        function moveEditQuestion(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= editCustomQuestions.length) return;
            [editCustomQuestions[index], editCustomQuestions[newIndex]] = [editCustomQuestions[newIndex], editCustomQuestions[index]];
            renderEditQuestions();
        }

        // 页面加载时获取数据
        loadQuestionnaires();
    </script>
</body>
</html>
